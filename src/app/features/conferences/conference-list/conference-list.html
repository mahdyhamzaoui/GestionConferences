<div class="conferences-container">
  <div class="list-card-wrapper">
    <div class="list-header">
      <div class="title-with-badge">
        <h2 class="list-title">Conférences</h2>
        <span class="count-badge">{{ conferences().length }}</span>
      </div>
    </div>

    <div class="cards-list">
      @for (conf of conferences(); track conf.id) {
        <article
          class="conf-item"
          [routerLink]="['/conferences', conf.id]"
        >
          <div class="item-top">
            <span class="category-pill">{{ conf.category }}</span>
            <span class="date-tag">📅 {{ conf.date }}</span>
          </div>

          <h3 class="conf-name">{{ conf.name }}</h3>

          <div class="item-meta">
            <span class="meta-info">📍 {{ conf.place }}</span>
            <span class="meta-info">🎤 {{ conf.speaker }}</span>
          </div>

          <div class="item-footer">
            <span class="seats-info">
              🎟️ <strong>{{ conf.availableSeats }}</strong> places restantes
            </span>
            <a [routerLink]="['/conferences', conf.id]" class="select-hint">Voir détails</a>
          </div>
        </article>
      }
    </div>
  </div>
</div>
